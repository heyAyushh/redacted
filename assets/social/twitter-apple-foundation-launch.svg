<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">redacted Apple Foundation launch banner</title>
  <desc id="desc">Announcement banner for redacted adding Apple Foundation Models local privacy filtering.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0C10"/>
      <stop offset="0.45" stop-color="#111723"/>
      <stop offset="1" stop-color="#1B283B"/>
    </linearGradient>
    <linearGradient id="panel" x1="240" y1="180" x2="1360" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="250" x2="1320" y2="670" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EE7C4"/>
      <stop offset="0.45" stop-color="#78C8FF"/>
      <stop offset="1" stop-color="#C6D2FF"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.5" filter="url(#blur)">
    <circle cx="1360" cy="120" r="140" fill="#7EE7C4"/>
    <circle cx="1220" cy="700" r="180" fill="#5AA5FF"/>
    <circle cx="280" cy="760" r="160" fill="#8D7BFF"/>
  </g>

  <rect x="116" y="116" width="1368" height="668" rx="36" fill="rgba(9,13,20,0.55)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="148" y="148" width="1304" height="604" rx="30" fill="rgba(255,255,255,0.04)"/>

  <rect x="196" y="196" width="210" height="52" rx="26" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
  <text x="236" y="229" fill="#EAF1FF" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600">redacted</text>
  <text x="365" y="229" fill="#A8B4C8" font-family="'SF Mono',Menlo,monospace" font-size="19" font-weight="500">--privacy-filter</text>

  <g transform="translate(206 300)">
    <rect width="176" height="176" rx="40" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <text x="88" y="118" text-anchor="middle" fill="#F8FBFF" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="108" font-weight="700"></text>
  </g>

  <text x="430" y="330" fill="#D8E2F1" font-family="'SF Mono',Menlo,monospace" font-size="28" font-weight="600">LAUNCHING NOW</text>
  <text x="430" y="420" fill="#F9FBFF" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="750">Apple-local privacy</text>
  <text x="430" y="496" fill="#F9FBFF" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="750">filtering ships now</text>
  <text x="430" y="560" fill="#A9B8CC" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500">System on-device model. Lean Rust core. No extra model bundle.</text>

  <rect x="430" y="624" width="272" height="58" rx="29" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
  <text x="466" y="661" fill="#EAF2FF" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600">  apple/foundation-v1</text>

  <rect x="724" y="624" width="252" height="58" rx="29" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
  <text x="760" y="661" fill="#EAF2FF" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600">No extra download</text>

  <rect x="998" y="624" width="262" height="58" rx="29" fill="url(#accent)"/>
  <text x="1036" y="661" fill="#08111A" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700">Production ready</text>

  <g transform="translate(206 612)">
    <path d="M48 0H112C138.51 0 160 21.49 160 48V112C160 138.51 138.51 160 112 160H48C21.49 160 0 138.51 0 112V48C0 21.49 21.49 0 48 0Z" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
    <path d="M80 38L115 52V78C115 102 100 124 80 132C60 124 45 102 45 78V52L80 38Z" fill="none" stroke="#D7E5FF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M66 82L77 93L97 68" fill="none" stroke="#7EE7C4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="1280" y="724" text-anchor="end" fill="#A4B3C6" font-family="'SF Mono',Menlo,monospace" font-size="24" font-weight="500">twitter announcement asset</text>
</svg>
