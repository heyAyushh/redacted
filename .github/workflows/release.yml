name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create as a draft release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: redacted
            archive: tar
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: redacted
            archive: tar
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: redacted
            archive: tar
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: redacted.exe
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Validate release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v0.1.0" >&2
            exit 2
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="redacted-${VERSION}-${MATRIX_NAME}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "dist/${asset}" "${BINARY}"
          shasum -a 256 "dist/${asset}" > "dist/${asset}.sha256"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "redacted-$env:VERSION-$env:MATRIX_NAME.zip"
          Compress-Archive -Path "target/$env:TARGET/release/$env:BINARY" -DestinationPath "dist/$asset" -Force
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  dist/$asset" | Out-File -Encoding ascii "dist/$asset.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: redacted-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v0.1.0" >&2
            exit 2
          fi

          cat > RELEASE_NOTES.md <<NOTES
          ## Install

          Download the archive for your platform, unpack it, and run:

          ```bash
          ./redacted --help
          ```

          ## Local build

          ```bash
          cargo install --git https://github.com/${REPOSITORY} --tag ${VERSION} --force
          ```
          NOTES

          args=(
            "${VERSION}"
            dist/*
            --target "${GITHUB_SHA}"
            --title "redacted ${VERSION}"
            --notes-file RELEASE_NOTES.md
          )

          if [[ "${DRAFT}" == "true" ]]; then
            args+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
