name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test CLI
        run: |
          set -euo pipefail
          ./target/release/redacted --version
          ./target/release/redacted --text "email jane@example.com password=correct-horse-battery-staple"
          ./target/release/redacted provider list

      - name: Assert CI does not download provider models
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          export REDACTED_CONFIG_HOME="$tmp_home/config"
          export REDACTED_DATA_HOME="$tmp_home/data"

          if ./target/release/redacted --privacy-filter --text "hello" >/tmp/redacted.out 2>/tmp/redacted.err; then
            echo "privacy-filter unexpectedly succeeded without a configured provider" >&2
            exit 1
          fi
          grep -q "No active privacy-filter provider is configured" /tmp/redacted.err
          test ! -e "$REDACTED_DATA_HOME/providers"
